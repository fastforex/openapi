  /metals/spot:
    get:
      tags:
        - "metals"
        - "plan-premium"
      description: >-
        Spot price for a single metal, in the currency, unit of mass and purity you ask for.


        The instrument actually quoted is chosen from the metal, currency and unit
        together, and is reported as `source_instrument`. Where no instrument is quoted
        directly in the requested currency, the price is crossed via USD and `cross_rate`
        is true - this consumes an additional FX product call and widens the bid/ask gap.
      parameters:
        - name: "metal"
          in: "query"
          description: "Metal symbol, defaults to XAU"
          required: false
          allowEmptyValue: true
          schema:
            $ref: "#/components/schemas/MetalSymbol"
        - name: "currency"
          in: "query"
          description: "Target currency, defaults to USD"
          required: false
          allowEmptyValue: true
          schema:
            $ref: "#/components/schemas/Currency"
        - name: "unit"
          in: "query"
          description: "Unit of mass to price in. Defaults to oz_t for precious metals and metric_tonne for base metals."
          required: false
          allowEmptyValue: true
          schema:
            $ref: "#/components/schemas/MetalUnit"
        - name: "purity"
          in: "query"
          description: >-
            Purity to price at, for precious metals only - ignored for base metals. Either
            a code from /metals/purities, or any custom fineness between 0 and 1000
            exclusive of zero. Omit for the quoted (pure) price.
          required: false
          allowEmptyValue: true
          schema:
            $ref: "#/components/schemas/MetalPurityCode"
        - name: "verbose"
          in: "query"
          description: "Include the display-name fields in the response"
          required: false
          allowEmptyValue: true
          schema:
            $ref: "#/components/schemas/VerboseFlag"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MetalSpot"
                  - type: object
                    properties:
                      ms:
                        $ref: "#/components/schemas/ResponseTime"
              examples:
                precious:
                  summary: "Gold in USD per troy ounce"
                  value:
                    bid: "2500.10"
                    ask: "2500.90"
                    mid: "2500.50"
                    spread: "0.80"
                    metal: XAU
                    currency: USD
                    unit: oz_t
                    tsp: 1739305030072
                    dtm: "2026-08-16T21:02:19Z"
                    cross_rate: false
                    source: otc_aggregate
                    source_instrument: XAUUSD
                    purity: "1000"
                    purity_name: Pure Gold Spot
                    ms: 6
                purity_and_unit:
                  summary: "18 carat gold per gram, verbose"
                  value:
                    bid: "60.3097"
                    ask: "60.3290"
                    mid: "60.3193"
                    spread: "0.0193"
                    metal: XAU
                    metal_name: Gold
                    currency: USD
                    currency_name: United States Dollar
                    unit: gram
                    unit_name: Gram
                    tsp: 1739305030072
                    dtm: "2026-08-16T21:02:19Z"
                    cross_rate: false
                    source: otc_aggregate
                    source_instrument: GAUUSD
                    purity: "750"
                    purity_name: 18K
                    ms: 7
                base_metal:
                  summary: "Copper in USD per tonne, crossed via USD"
                  value:
                    bid: "9500.00"
                    ask: "9510.00"
                    mid: "9505.00"
                    spread: "10.00"
                    metal: XCU
                    currency: EUR
                    unit: metric_tonne
                    tsp: 1739305030072
                    dtm: "2026-08-16T21:02:19Z"
                    cross_rate: true
                    source: otc_aggregate
                    source_instrument: XCUUSD
                    grade: grade_a
                    ms: 9
        "400":
          description: "Bad Request - unknown metal, currency, unit or purity"
        "401":
          description: "Not Authorized"
        "403":
          description: "Forbidden"
        "429":
          description: "Rate limit exceeded"
        "500":
          description: "Upstream price data unavailable"
  /metals/quote:
    get:
      tags:
        - "metals"
        - "plan-premium"
      description: >-
        Latest bid/ask for up to 10 metals instruments, quoted exactly as the feed
        supplies them - no unit, purity or currency conversion is applied.


        Instruments beyond the first 10 are reported under `warnings.ignored_instruments`,
        and unrecognised ones under `warnings.invalid_instruments`. The request fails only
        if no valid instrument is supplied at all.
      parameters:
        - name: "instruments"
          in: "query"
          description: "Comma-separated list of instrument symbols, maximum 10"
          required: true
          schema:
            $ref: "#/components/schemas/MetalInstrumentList"
        - name: "verbose"
          in: "query"
          description: "Include the display-name fields in the response"
          required: false
          allowEmptyValue: true
          schema:
            $ref: "#/components/schemas/VerboseFlag"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ms:
                    $ref: "#/components/schemas/ResponseTime"
                  source:
                    type: string
                    description: "Origin of the price data"
                  quotes:
                    type: object
                    description: "Quotes keyed by instrument symbol"
                    minProperties: 1
                    maxProperties: 10
                    additionalProperties:
                      $ref: "#/components/schemas/MetalQuote"
                  warnings:
                    type: object
                    description: "Present only when some supplied instruments were not quoted"
                    properties:
                      invalid_instruments:
                        type: array
                        description: "Supplied symbols that are not recognised"
                        items:
                          type: string
                      ignored_instruments:
                        type: array
                        description: "Valid symbols dropped for exceeding the 10 instrument limit"
                        items:
                          type: string
              example:
                quotes:
                  XAUUSD:
                    bid: "2500.10"
                    ask: "2500.90"
                    mid: "2500.50"
                    spread: "0.80"
                    tsp: 1739305030072
                    dtm: "2026-08-16T21:02:19Z"
                    metal: XAU
                    target: USD
                    unit: oz_t
                    purity: "1000"
                    cross_rate: false
                  XCUUSD:
                    bid: "9500.00"
                    ask: "9510.00"
                    mid: "9505.00"
                    spread: "10.00"
                    tsp: 1739305030072
                    dtm: "2026-08-16T21:02:19Z"
                    metal: XCU
                    target: USD
                    unit: metric_tonne
                    cross_rate: false
                source: otc_aggregate
                warnings:
                  invalid_instruments:
                    - XYZUSD
                ms: 8
        "400":
          description: "Bad Request - no valid metals instruments provided"
        "401":
          description: "Not Authorized"
        "403":
          description: "Forbidden"
        "429":
          description: "Rate limit exceeded"
        "500":
          description: "Upstream price data unavailable"
  /usage:
