        "401":
          description: "Not Authorized"
        "429":
          description: "Rate limit exceeded"
security:
  - api_key: []
  - apiKeyHeader: []
  - bearerAuth: []
  - basicAuth: []
components:
  schemas:
    Currency:
      type: "string"
      pattern: "[A-Z]{3}"
      description: "Three-letter ISO 4217 currency code"
    CurrencyList:
      type: "string"
      pattern: "[A-Z]{3}(,[A-Z]{3})*"
      description: "A comma-separated list of three-letter ISO 4217 currency codes"
    AnyCurrency:
      type: "string"
      pattern: "[A-Z0-9]{3,6}"
      description: "Currency code for a physical or digital/cryptocurrency"
    CryptoCurrencyPairList:
      type: "string"
      pattern: "[A-Z0-9]{3,6}/[A-Z0-9]{3,6}(,[A-Z0-9]{3,6}/[A-Z0-9]{3,6})*"
      description: "A comma-separated list of crypto pairs"
    TradingPair:
      type: "string"
      pattern: "[A-Z0-9]{3,6}/?[A-Z0-9]{3,6}"
      description: "A single FX trading pair, with or without a slash"
    TradingPairList:
      type: "string"
      pattern: "[A-Z0-9]{3,6}/?[A-Z0-9]{3,6}(,[A-Z0-9]{3,6}/?[A-Z0-9]{3,6})*"
      description: "A comma-separated list of FX trading pairs"
    AnyCurrencyPair:
      type: object
      description: "Defines a currency trading pair."
      properties:
        base:
          type: string
          pattern: "[A-Z0-9]{3,6}"
          description: "Base currency in the pair"
        quote:
          type: string
          pattern: "[A-Z0-9]{3,6}"
          description: "Quote currency in the pair"
      example:
        base: USD
        quote: BTC
    AnyTradingPair:
      type: object
      description: "Defines a currency trading pair."
      properties:
        base:
          type: string
          pattern: "[A-Z0-9]{3,6}"
          description: "Base currency in the pair"
        quote:
          type: string
          pattern: "[A-Z0-9]{3,6}"
          description: "Quote currency in the pair"
        alt:
          type: string
          pattern: "[A-Z0-9]{6,8}"
          description: "Alternative trading pair identifier"
      example:
        base: EUR
        quote: USD
        alt: EURUSD
    MetalSymbol:
      type: "string"
      pattern: "X[A-Z]{2}"
      description: "Three-letter metal symbol, e.g. XAU for gold"
      example: "XAU"
    MetalUnit:
      type: "string"
      description: "Handle for a unit of mass that metal prices can be quoted in"
      enum: [gram, kilogram, metric_tonne, grain, pennyweight, oz_t, lb_t, oz_av, lb_av, tael, baht, tola]
    MetalCategory:
      type: "string"
      description: "Whether the metal is a precious or a base metal"
      enum: [precious_metal, base_metal]
    MetalInstrumentType:
      type: "string"
      description: "spot is priced in a currency, crypto in a cryptocurrency, and ratio against another metal. A ratio has no unit of mass."
      enum: [spot, crypto, ratio]
    MetalInstrumentList:
      type: "string"
      pattern: "[A-Z]{6,7}(,[A-Z]{6,7})*"
      description: "A comma-separated list of metals instrument symbols"
      example: "XAUUSD,XAGUSD"
    MetalPurityCode:
      type: "string"
      description: "A purity code from /metals/purities (e.g. '750'), or any custom fineness in parts per thousand between 1 and 1000. A custom value is echoed back with a purity_name of 'custom'."
      example: "750"
    VerboseFlag:
      type: "string"
      description: "Truthy values are true, 1, yes and y. Anything else is treated as false."
      example: "true"
    MetalPrice:
      type: "string"
      description: "A price, as a string to preserve the significant figures of the source quote. Parse as a decimal rather than a float where precision matters."
      example: "2500.50"
    MetalQuote:
      type: object
      description: >-
        A single instrument quote, exactly as the feed supplies it. ask, mid and spread
        are absent when the feed has published no ask for the instrument.
      properties:
        bid:
          $ref: "#/components/schemas/MetalPrice"
        ask:
          $ref: "#/components/schemas/MetalPrice"
        mid:
          $ref: "#/components/schemas/MetalPrice"
        spread:
          $ref: "#/components/schemas/MetalPrice"
        tsp:
          $ref: "#/components/schemas/TimestampMillis"
        dtm:
          type: string
          description: "Quote time, formatted per the account's datetime format"
        metal:
          $ref: "#/components/schemas/MetalSymbol"
        metal_name:
          type: string
          description: "Metal name. Verbose only."
        target:
          type: string
          pattern: "[A-Z0-9]{3,6}"
          description: "What the instrument is priced against"
        target_name:
          type: string
          description: "Display name for the target. Verbose only."
        unit:
          $ref: "#/components/schemas/MetalUnit"
        unit_name:
          type: string
          description: "Display name for the unit. Verbose only, and absent for a ratio."
        purity:
          type: string
          description: "Purity code the instrument is quoted at. Precious metals only."
        cross_rate:
          type: boolean
          description: "Always false here - this endpoint applies no conversion"
      required:
        - bid
        - tsp
        - dtm
        - metal
        - target
        - cross_rate
    MetalSpot:
      type: object
      description: >-
        A spot price converted to the requested currency, unit and purity. The *_name
        fields appear only when verbose is set. grade fields appear for base metals,
        purity fields for precious metals.
      properties:
        bid:
          $ref: "#/components/schemas/MetalPrice"
        ask:
          $ref: "#/components/schemas/MetalPrice"
        mid:
          $ref: "#/components/schemas/MetalPrice"
        spread:
          $ref: "#/components/schemas/MetalPrice"
        metal:
          $ref: "#/components/schemas/MetalSymbol"
        metal_name:
          type: string
          description: "Metal name. Verbose only."
        currency:
          $ref: "#/components/schemas/Currency"
        currency_name:
          type: string
          description: "Currency name. Verbose only."
        unit:
          $ref: "#/components/schemas/MetalUnit"
        unit_name:
          type: string
          description: "Display name for the unit. Verbose only."
        tsp:
          $ref: "#/components/schemas/TimestampMillis"
        dtm:
          type: string
          description: "Quote time, formatted per the account's datetime format"
        cross_rate:
          type: boolean
          description: "True when the price was crossed via USD rather than quoted directly in the requested currency"
        source:
          type: string
          description: "Origin of the price data"
        source_instrument:
          type: string
          description: "The instrument actually quoted to build this price"
        grade:
          type: string
          description: "Deliverable contract grade. Base metals only."
        grade_name:
          type: string
          description: "Display name for the contract grade. Base metals only, verbose only."
        grade_min_purity_pct:
          type: number
          format: float
          description: "Minimum purity of the contract grade, as a percentage. Base metals only, verbose only."
        purity:
          type: string
          description: "Purity code the price is quoted at. Precious metals only."
        purity_name:
          type: string
          description: "Display name for the purity, or 'custom' for a caller-supplied fineness. Precious metals only."
      required:
        - bid
        - metal
        - currency
        - unit
        - tsp
        - dtm
        - cross_rate
        - source
        - source_instrument
    MetalPurity:
      type: object
      description: "A purity grade a metal is dealt in."
      properties:
        code:
          type: string
          description: "Identifies the grade within its metal. The fineness with any trailing zero dropped."
        name:
          type: string
          description: "Display name for the grade"
        fineness:
          type: string
          description: "Parts per thousand, as a string to preserve precision. Multiply by fineness/1000 to value an alloy."
      example:
        code: "925"
        name: Sterling
        fineness: "925.0"
    MetalInstrument:
      type: object
      description: "A tradeable metals instrument."
      properties:
        symbol:
          type: string
          pattern: "[A-Z]{6,7}"
          description: "Instrument symbol, repeating the key so the entry stands alone"
        alt:
          type: string
          description: "Slash-separated form of the symbol, split after the leading metal code"
        metal:
          $ref: "#/components/schemas/MetalSymbol"
        name:
          type: string
          description: "Metal name"
        category:
          $ref: "#/components/schemas/MetalCategory"
        grade:
          type: string
          description: "Deliverable contract grade. Base metals only."
        grade_name:
          type: string
          description: "Display name for the contract grade. Base metals only."
        grade_min_purity_pct:
          type: number
          format: float
          description: "Minimum purity of the contract grade, as a percentage. Base metals only."
        target:
          type: string
          pattern: "[A-Z0-9]{3,6}"
          description: "What the metal is priced against - a currency, a cryptocurrency, or another metal for a ratio"
        target_name:
          type: string
          description: "Display name for the target"
        unit:
          $ref: "#/components/schemas/MetalUnit"
        unit_name:
          type: string
          description: "Display name for the unit of mass"
        purity:
          type: string
          description: "Purity grade code the instrument is quoted at, as per /metals/purities. Precious metals only."
        type:
          $ref: "#/components/schemas/MetalInstrumentType"
      example:
        symbol: XAUUSD
        alt: XAU/USD
        metal: XAU
        name: Gold
        category: precious_metal
        target: USD
        target_name: United States Dollar
        unit: oz_t
        unit_name: Troy Ounce
        type: spot
        purity: "1000"
    ResponseTime:
      type: number
      format: int32
      description: "Server response time in milliseconds"
    ApiUsage:
      type: number
      format: int32
      description: "The number of API calls consumed by this request"
    TimestampMillis:
      type: number
      format: int64
      description: "Milliseconds since Jan 1 1970 (unix timestamp with millisecond precision)"
      example: 1739305030072
    FxQuotePrice:
      type: "string"
      description: >-
        A bid or ask price, serialised as a JSON string so the exact precision of the
        source quote is preserved. Parse as a decimal rather than a float where precision
        matters. Deliberately kept separate from the metals price type so the two can
        evolve independently.
      example: "1.13087"
    TimestampMillisString:
      type: string
      pattern: "[0-9]+"
      description: >-
        Milliseconds since Jan 1 1970, serialised as a JSON string. Retained as-is on
        /fx/quote so existing integrations keep working; newer endpoints emit a number
        (see TimestampMillis).
      example: "1739305030072"
    IsoDateTimeZone:
      type: string
      pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z?|[+-][0-9]{2}:00)"
      description: "ISO8601 Datetime with optional timezone offset YYYY-MM-DDTHH:MM:SS±HH:00"
      example: "2021-01-26T15:30:00-05:00"
    DateTime:
      type: string
      pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}"
      description: "UTC/GMT datetime YYYY-MM-DD HH:MM:SS"
    Date:
      type: string
      pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}"
      description: "UTC/GMT date YYYY-MM-DD"
    DateOrDateTime:
      description: "A datetime value. If no timezone offset supplied, UTC/GMT is assumed. If only a date is supplied, time is assumed to be 00:00:00 UTC."
      oneOf:
        - $ref: "#/components/schemas/Date"
        - $ref: "#/components/schemas/DateTime"
        - $ref: "#/components/schemas/IsoDateTimeZone"
        - $ref: "#/components/schemas/TimestampMillis"
    DateTimes:
      description: "A datetime value. If no timezone offset supplied, UTC/GMT is assumed."
      oneOf:
        - $ref: "#/components/schemas/DateTime"
        - $ref: "#/components/schemas/IsoDateTimeZone"
        - $ref: "#/components/schemas/TimestampMillis"
    DateTimeFormat:
      description: "Can be [ISO] ISO8601 datetime including timezone offset, [TSP] UNIX Timestamp in milliseconds, or [UTCYMD] 'YYYY-MM-DD HH:MM:SS' (UTC)."
      type: string
      enum: [ISO, TSP, UTCYMD]
    Duration:
      type: string
      description: "ISO8601 Duration. https://en.wikipedia.org/wiki/ISO_8601#Durations"
    PriceType:
      type: string
      description: "bid or ask"
      enum: [bid, ask]
    QuoteSize:
      type: number
      format: int32
      description: "Size of the quote is units of the base currency/symbol. Usually 1."
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: query
    apiKeyHeader:
      type: apiKey
      name: X-API-KEY
      in: header
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: api_key
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: "Find out more about fastFOREX API"
  url: "https://www.fastforex.io"
x-samples-languages:
  - curl
  - node
  - ruby
  - javascript
  - python
  - php
  - go
  - java
  - swift
x-proxy-enabled: false
