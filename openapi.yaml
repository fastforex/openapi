openapi: "3.0.3"
info:
  title: "fastFOREX API"
  version: "2.4.3"
  description: "Exchange rate API including historical Currency data, real time Gold, Metals and Crypto. JSON or WebSockets."
  termsOfService: "https://www.fastforex.io/terms-of-sale"
  contact:
    email: "support@fastforex.io"
  license:
    name: "Apache 2.0"
    url: "https://www.apache.org/licenses/LICENSE-2.0.html"
servers:
  - url: "https://api.fastforex.io"
    description: "Production"
  - url: "https://api.beta.fastforex.io"
    description: "Beta"
tags:
  - name: "currency"
    description: "Physical currencies, rates and conversions"
  - name: "crypto"
    description: "Digital currencies, pairs & prices"
  - name: "fx"
    description: "Realtime FX trading pairs - instruments, prices and history"
  - name: "metals"
    description: "Precious and base metals - instruments, units, purities and prices"
  - name: "admin"
    description: "Account admin"
  - name: "plan-one"
    description: "Available on The One Plan"
  - name: "plan-extra"
    description: "Available on The Extra Plan"
  - name: "plan-premium"
    description: "Available on The Premium Plan"
paths:
  /fetch-one:
    get:
      tags:
        - "currency"
        - "crypto"
        - "plan-one"
        - "plan-extra"
        - "plan-premium"
      description: >-
        Fetch a single currency exchange rate, from and to any supported physical or 
        digital currency. Midpoint spot rate.


        We also support metals (Gold, Silver, etc.) against physical currencies. 
        e.g. XAU => USD.
        
        
        We don't yet support crypto-metal rates here.
      parameters:
        - name: "from"
          in: "query"
          description: "Base currency symbol (physical, crypto or metal), defaults to USD"
          required: false
          allowEmptyValue: true
          schema:
            oneOf:
              - $ref: "#/components/schemas/AnyCurrency"
              - $ref: "#/components/schemas/MetalSymbol"
        - name: "to"
          in: "query"
          description: "Target currency symbol (physical, crypto or metal), defaults to USD"
          required: true
          schema:
            oneOf:
              - $ref: "#/components/schemas/AnyCurrency"
              - $ref: "#/components/schemas/MetalSymbol"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: object
                properties:
                  base:
                    $ref: "#/components/schemas/AnyCurrency"
                  updated:
                    $ref: "#/components/schemas/DateTimes"
                  ms:
                    $ref: "#/components/schemas/ResponseTime"
                  result:
                    type: object
                    minProperties: 1
                    maxProperties: 1
                    additionalProperties:
                      type: number
                      format: float
              example:
                base: USD
                result:
                  EUR: 0.82791
                updated: '2021-01-16T16:34:29Z'
                ms: 4
        "400":
          description: "Bad Request"
        "401":
          description: "Not Authorized"
        "403":
          description: "Forbidden"
        "429":
          description: "Rate limit exceeded"
  /fetch-multi:
    get:
      tags:
        - "currency"
        - "plan-one"
        - "plan-extra"
        - "plan-premium"
      description: >-
        Fetch multiple target exchange rates from a single source currency in a single endpoint. 
        Returns midpoint spot rates.


        We also support metals (Gold, Silver, etc.) to multiple physical currencies. 
        e.g. XAU => USD,GBP,CHF.
        
        
        When using this endpoint with metals, each target currency and further cross-rate conversions 
        count as 1x additional API call.
      parameters:
        - name: "from"
          in: "query"
          description: "Base currency 3-letter symbol, defaults to USD. Supports physical currencies and metals."
          required: false
          allowEmptyValue: true
          schema:
            oneOf:
              - $ref: "#/components/schemas/Currency"
              - $ref: "#/components/schemas/MetalSymbol"
        - name: "to"
          in: "query"
          description: "Target physical currencies, comma separated list of 3-letter symbols"
          required: true
          schema:
            $ref: "#/components/schemas/CurrencyList"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: object
                properties:
                  base:
                    $ref: "#/components/schemas/Currency"
                  updated:
                    $ref: "#/components/schemas/DateTimes"
                  ms:
                    $ref: "#/components/schemas/ResponseTime"
                  results:
                    type: object
                    minProperties: 1
                    additionalProperties:
                      type: number
                      format: float
              example:
                base: USD
                results:
                  EUR: 0.82791
                  GBP: 0.73605
                updated: '2021-01-16T16:34:29Z'
                ms: 8
        "400":
          description: "Bad Request"
        "401":
          description: "Not Authorized"
        "403":
          description: "Forbidden"
        "429":
          description: "Rate limit exceeded"
  /fetch-all:
    get:
      tags:
        - "currency"
        - "plan-one"
        - "plan-extra"
        - "plan-premium"
      description: "Fetch all available currency rates for the supplied source currency. Midpoint spot rates."
      parameters:
        - name: "from"
          in: "query"
          description: "Base currency 3-letter symbol, defaults to USD"
          required: false
          allowEmptyValue: true
          schema:
            $ref: "#/components/schemas/Currency"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: object
                properties:
                  base:
                    $ref: "#/components/schemas/Currency"
                  updated:
                    $ref: "#/components/schemas/DateTimes"
                  ms:
                    $ref: "#/components/schemas/ResponseTime"
